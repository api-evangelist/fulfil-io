aid: fulfil-io
url: https://raw.githubusercontent.com/api-evangelist/fulfil-io/refs/heads/main/apis.yml
name: Fulfil
kind: company
description: Fulfil is a cloud ERP and operations platform for e-commerce, DTC, and
  wholesale merchants - unifying order management, inventory, warehouse operations
  (WMS), manufacturing and production (MRP), purchasing, and accounting in one system,
  purpose-built for Shopify Plus and high-volume DTC brands. The Fulfil REST API (v2)
  exposes every ERP model through a single uniform model interface at
  https://{merchant_id}.fulfil.io/api/v2, advertising 6,000+ endpoints with full
  create/read/update/delete access, action calls, reports, and wizards across all
  models. Authentication is via OAuth 2.0 for public apps or personal access tokens
  (X-API-KEY / HTTP Basic) for private integrations, and outbound webhooks (with a
  Google Pub/Sub option) deliver real-time ERP events such as order and shipment
  changes.
accessModel:
