meters:
- name: erp_subscription
  description: Recurring Fulfil ERP subscription fee, scaled by modules, seats, volume, and warehouses.
  unit: subscription
  aggregation: sum
  dimensions:
  - account
  - module
- name: user_seats
  description: Number of licensed users on the subscription.
  unit: seats
  aggregation: max
  dimensions:
  - account
- name: api_requests
  description: REST API requests (no direct charge; monitored against plan rate limits, not billed per call).
  unit: requests
  aggregation: sum
