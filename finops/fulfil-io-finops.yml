description: >-
  FinOps view of Fulfil spend. Fulfil is a subscription cloud ERP billed by
  quote, scaling with the modules deployed (order management, WMS,
  manufacturing/MRP, accounting), order and shipment volume, user seats, and
  warehouses. The REST API carries no separate per-call charge - it is included
  with the subscription - so API "cost" is effectively the ERP subscription plus
  the engineering effort to build and operate integrations. There is no
  usage-metered API line item to allocate; cost management centers on right-sizing
  the subscription (modules, seats) and on efficient integration design.
notes: >-
  Fulfil does not publish per-unit or per-call rates; the dominant, recurring
  cost is the negotiated ERP subscription. Verify packaging, seat counts, and
  any onboarding/implementation fees with Fulfil. There is no consumption meter
  to reconcile against a FOCUS usage record for the API itself.
