principles:
- name: Visibility
  description: Track which modules and how many seats are actually used; monitor API request volume against the plan's rate limit even though it is not separately billed.
- name: Allocation
  description: Attribute the ERP subscription to the teams and channels (Shopify, wholesale, manufacturing) that depend on it; tag integrations by owner.
- name: Optimization
  description: Right-size modules and seats; design integrations to use webhooks/Pub/Sub and search_read/pagination efficiently so a single subscription serves more workload without hitting rate limits.
- name: Accountability
  description: Review the subscription and integration footprint on a regular cadence; renegotiate packaging as order/shipment volume changes.
